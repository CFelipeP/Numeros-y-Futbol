<VirtualHost *:80>
    DocumentRoot /var/www/html

    AddDefaultCharset UTF-8
    AddType video/mp4 .mp4
    AddType video/webm .webm

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; media-src 'self'"

    <FilesMatch "\.(env|bak|sql|save|old|tmp|swp|dist|ini|log|md)$">
        Require all denied
    </FilesMatch>
    <Files "get_oauth_token.php">
        Require all denied
    </Files>

    Options -Indexes
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    <Directory /var/www/html/backend>
        RewriteEngine Off
        Require all granted
        php_value default_charset "UTF-8"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
